# Pulse Pipeline CI.
#
# CI runs the same Makefile targets developers and the pr-reviewer gatekeeper run
# locally (`make build`, `make test`, `make lint`, `make e2e`), so there is a
# single definition of "green". web/ steps activate automatically once
# web/package.json exists (see web/README.md for the required npm scripts).
#
# Third-party actions are pinned to full commit SHAs; Dependabot
# (.github/dependabot.yml) keeps the pins current.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  SQLC_VERSION: "1.31.1"
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  forbidden-files:
    name: Forbidden-file scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out (full history for merge-base)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Blocks .env files, keys and credential JSON added anywhere in the
      # branch/pushed history, even if a later commit removed them. Test/lint run in
      # the build-test-lint job, so make targets are skipped here.
      - name: Run PR gatekeeper (forbidden files only)
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            python3 .agents/skills/pr-reviewer/scripts/pr_gatekeeper.py \
              --skip-make --no-fetch --push-before "$PUSH_BEFORE"
          else
            python3 .agents/skills/pr-reviewer/scripts/pr_gatekeeper.py \
              --skip-make --no-fetch --base "$BASE_REF"
          fi
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref || 'main' }}

  sqlc-drift:
    name: sqlc generated code up to date
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up sqlc
        uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6 # v5.0.0
        with:
          sqlc-version: ${{ env.SQLC_VERSION }}

      # Fails when backend/internal/store/db differs from what the SQL queries
      # and migrations generate, i.e. someone forgot `make generate`.
      - name: Check for drift
        run: make generate-check

  build-test-lint:
    name: Build, test & lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.mod
            mcp/go.mod

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true

      - name: Set up Node (web/)
        if: hashFiles('web/package.json') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm ci

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Lint
        run: make lint

      - name: Install Playwright browsers (web/)
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npx playwright install --with-deps

      - name: E2E (desktop + mobile viewports)
        if: hashFiles('web/package.json') != ''
        run: make e2e
