# Keeps SHA-pinned GitHub Actions, Go modules and web/ npm packages up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directories:
      - /backend
      - /mcp
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]

  # Minor and patch bumps arrive as one grouped PR; each major bump gets its own PR.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
