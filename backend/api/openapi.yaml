openapi: 3.1.0
info:
  title: Pulse Pipeline API
  version: 1.0.0
  summary: Session-scoped read API for the Pulse Pipeline web and PWA dashboards.
  description: |
    The contract for `/api/v1` (ADR-0005). Go server types are generated with
    `oapi-codegen` into `backend/internal/api/gen` and TypeScript types with
    `openapi-typescript` into `web/src/api/schema.d.ts`; run `make generate` after
    editing this file. CI fails when the generated code is out of date.

    Conventions (ADR-0005 §1):
    - Local calendar days are `YYYY-MM-DD` in the user's timezone; instants are RFC 3339 UTC.
    - Missing values are `null`, never zero-filled.
    - Every response carries `Cache-Control: no-store`.
    - Errors are RFC 9457 `application/problem+json` with a stable `type` per error;
      the types are listed in `docs/api/problems.md`.

    Authentication (ADR-0005 §2–3): every operation needs the session cookie unless it
    declares `security: []`. The signed-in user is always the session's user: no operation
    accepts a user ID. State-changing requests from another origin are rejected with a
    `cross-origin-request` problem.
servers:
  - url: /api/v1

# Every operation requires a session unless it opts out with `security: []`.
security:
  - session: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: API readiness
      description: |
        Reports whether the API can serve requests, including a database round trip.
        Needs no session. Container liveness probes use `/healthz` outside `/api` instead,
        which does not touch the database.
      tags: [system]
      security: []
      responses:
        '200':
          description: The API and its database are reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Problem'

  /auth/google/login:
    get:
      operationId: startGoogleSignIn
      summary: Start Google sign-in
      description: |
        Redirects the browser to Google's account chooser to sign in with OpenID Connect
        (authorization code, PKCE `S256`, scopes `openid email` only). Sets the ten-minute
        OAuth flow cookie (`__Host-pulse_oauth`; `pulse_oauth` with `ENV=development`)
        holding the state and PKCE verifier. Signing in never asks for health data;
        linking a wearable is a separate consent.
      tags: [auth]
      security: []
      responses:
        '302':
          description: Redirect to Google. Sets the OAuth flow cookie.
          headers:
            Location:
              description: Google's consent URL.
              schema:
                type: string
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Problem'

  /auth/google/callback:
    get:
      operationId: finishGoogleSignIn
      summary: Finish Google sign-in
      description: |
        Google redirects the browser here. The API checks the flow cookie and `state`,
        exchanges the code, checks the ID token and the `PULSE_ALLOWED_EMAILS` allowlist,
        then signs the user in: a returning Google identity signs in to its user, and a new
        one creates a user only when Google is authoritative for the email (Gmail or
        Google Workspace) and no user has it yet. On success it sets a new session cookie
        (`__Host-pulse_session`; `pulse_session` with `ENV=development`) and redirects to
        the web app. Every response expires the flow cookie, so a callback cannot be replayed.
      tags: [auth]
      security: []
      parameters:
        - name: code
          in: query
          required: false
          description: Google's authorization code.
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: The state sent with the authorization request.
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Google's OAuth error code, such as `access_denied` when the user cancelled.
          schema:
            type: string
      responses:
        '303':
          description: Signed in. Sets the session cookie and redirects to the web app.
          headers:
            Location:
              description: The web app's root, `/`.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/SignInFailed'
        '403':
          $ref: '#/components/responses/SignInDenied'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Problem'

  /auth/logout:
    post:
      operationId: signOut
      summary: Sign out
      description: |
        Deletes the current session, if any, and expires the session cookie. Succeeds without
        a valid session, so signing out is idempotent. Rejected when sent from another origin.
      tags: [auth]
      security: []
      responses:
        '204':
          description: Signed out. Expires the session cookie.
        '403':
          $ref: '#/components/responses/CrossOriginRequest'
        default:
          $ref: '#/components/responses/Problem'

  /me:
    get:
      operationId: getMe
      summary: The signed-in user's profile
      tags: [profile]
      responses:
        '200':
          description: The profile of the session's user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Problem'

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-pulse_session
      description: |
        The `HttpOnly`, `Secure`, `SameSite=Lax` session cookie set by Google sign-in: 32 random
        bytes, base64url-encoded; the server stores only their SHA-256. Sessions end after 30 days
        idle or 90 days after sign-in. With `ENV=development` the cookie is `pulse_session`
        without `Secure`, so plain `http://localhost` works.

  schemas:
    Me:
      type: object
      additionalProperties: false
      required: [email, timezone]
      properties:
        email:
          type: string
          description: The account's email address.
        timezone:
          type: string
          description: IANA timezone for local days, e.g. `Europe/Stockholm`. `UTC` until the user chooses one.

    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Problem:
      description: RFC 9457 problem details. Extension members may be added per problem type.
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: Stable identifier of the problem type, documented in docs/api/problems.md.
        title:
          type: string
          description: Short, human-readable summary of the problem type; the same for every occurrence.
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: The HTTP status code of this occurrence.
        detail:
          type: string
          description: Human-readable explanation of this occurrence. Never contains upstream or internal error text.
        instance:
          type: string
          description: URI reference identifying this occurrence.

  responses:
    Unauthenticated:
      description: No valid session; sign in again.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    SignInFailed:
      description: The sign-in could not be completed (expired or foreign flow, cancelled consent, or a code Google rejected); start again.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    SignInDenied:
      description: The Google account may not sign in (unlisted or unverified email, or an account that needs operator enrollment).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CrossOriginRequest:
      description: A state-changing request came from another origin.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem:
      description: Any other error, as RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: A dependency such as the database or Google is unreachable, or Google sign-in is not configured.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

tags:
  - name: system
    description: Operational endpoints.
  - name: auth
    description: Google sign-in and sign-out (ADR-0005 §2–3).
  - name: profile
    description: The signed-in user's profile and settings.
