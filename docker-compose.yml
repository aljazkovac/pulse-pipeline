services:
  postgres:
    image: postgres:17-alpine
    container_name: pulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-pulse_pipeline}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-pulse} -d ${POSTGRES_DB:-pulse_pipeline}"]
      interval: 5s
      timeout: 5s
      retries: 5

  flipt:
    image: docker.flipt.io/flipt/flipt:latest
    container_name: pulse-flipt
    restart: unless-stopped
    ports:
      - "${FLIPT_PORT:-8081}:8080"
    environment:
      FLIPT_LOG_LEVEL: info
      FLIPT_STORAGE_TYPE: local
    volumes:
      - flipt_data:/var/opt/flipt

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: pulse-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.5.2
    container_name: pulse-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  flipt_data:
  prometheus_data:
  grafana_data:
